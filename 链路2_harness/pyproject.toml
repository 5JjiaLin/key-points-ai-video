[project]
name = "huazhongdian-harness"
version = "0.1.0"
description = "Engineering harness for evaluating Key Points recovery card generation."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
]

[project.optional-dependencies]
media = [
  "faster-whisper>=1.1",
]
dev = [
  "pytest>=8",
]

[project.scripts]
harness = "huazhongdian_harness.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
huazhongdian_harness = ["prompts/*.md", "vision_ocr.swift"]
