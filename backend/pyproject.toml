[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huazhongdian-local-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "python-multipart", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

